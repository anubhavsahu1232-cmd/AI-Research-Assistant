
spring.application.name=research-assistant-backend
server.port=8080

# MySQL Database Configuration
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/research_assistant_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Groq AI Configuration
groq.api-key=${GROQ_API_KEY:}
groq.model=openai/gpt-oss-20b

# Server Encoding
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true

# JWT Configuration
app.jwt.secret=${JWT_SECRET}
